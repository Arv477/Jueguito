<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pueblo</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root{
  --pixel-font: "Press Start 2P", monospace;
}

body{
  background:#1b1b1b;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  font-family:var(--pixel-font);
  -webkit-font-smoothing:none;
  text-rendering:optimizeSpeed;
  overflow:hidden;
  touch-action:none;
}

*{
  font-family:var(--pixel-font);
}

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  width:100vw;
  height:100vh;
  max-width:100vw;
  max-height:100vh;
  touch-action:none;
}

#world{
  position:absolute;
  width:2880px;
  height:2880px;
  background-image: url("mapa.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  image-rendering:pixelated;
}

#fogLayer{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  pointer-events:none;
  opacity:0;
  transition:opacity 1.2s ease;
  z-index:9000;
}

#fogLayer.active{
  opacity:1;
}

.fog{
  position:absolute;
  width:120vw;
  height:120vh;
  background-image:url("Img/Neblina.png");
  background-size:cover;
  background-repeat:no-repeat;
  image-rendering:pixelated;
  opacity:0.7;
  animation-name:fogDrift;
  animation-iteration-count:infinite;
  animation-direction:normal;
  animation-timing-function:linear;
}

@keyframes fogDrift{
  from{ transform:translate(-50%, -50%) translateX(60vw) scale(var(--fog-scale, 0)); }
  to{ transform:translate(-50%, -50%) translateX(-200vw) scale(var(--fog-scale, 0)); }
}



/* ENTIDADES */
.entity{
  position:absolute;
  transform:translate(-50%, -100%);
  image-rendering:pixelated;
}

#player{
  width:32px;
  height:32px;
  overflow:hidden;
  image-rendering:pixelated;
}

#playerSprite{
  width:128px; /* 4 frames */
  height:128px; /* 4 direcciones */
  background:url("Personaje.png") no-repeat;
  image-rendering:pixelated;
}

#playerSprite.hurt{
  filter:brightness(0.8) sepia(1) hue-rotate(-35deg) saturate(8) drop-shadow(0 0 4px #ff2d2d);
}


/* OBJETOS */
.object img{
  display:block;
  pointer-events:none;
}

/* BLOQUES DE PAGO */

/* hitbox solo para colisión (opcional debug) */
.hitbox{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  background:rgba(0, 255, 0, 0);
}


/* HUD */
#hud{
  position:fixed;
  top:18px;
  left:0px;
  z-index:9999;
  font-family:var(--pixel-font);
  color:#42383a;
  image-rendering:pixelated;
}

.hud-box{
  display:flex;
  align-items:center;
  gap:20px;
  padding:10px 32px;
  background-image:url(HUD.png);
  background-size:contain;
  background-repeat:no-repeat;
}

.hud-box img{
  width:34px;
  height:37px;
  image-rendering: pixelated;
}

#coinCount{
  font-size:20px;
  line-height:0;
}

.health-box{
  gap:22px;
  image-rendering:pixelated;
}

.health-hearts{
  display:flex;
  gap:8px;
  image-rendering:pixelated;
}

.heart{
  width:52px;
  height:52px;
  background-image:url("Img/corazon.png");
  background-size:contain;
  background-repeat:no-repeat;
  image-rendering: pixelated;
  filter:grayscale(100%);
}

.heart.filled{
  opacity:1;
  filter:none;
}

/* MONEDAS */
.coin{
  position:absolute;
  width:16px;
  height:16px;
  transform:translate(-50%, -100%);
  image-rendering: pixelated;
  overflow:hidden;
}

.coinSprite{
  width:96px; /* 6 frames */
  height:16px;
  background:url("Img/coin.png") no-repeat;
}

/* ARBUSTOS */
.bush{
  position:absolute;
  width:16px;
  height:16px;
  transform:translate(-50%, -100%);
  image-rendering: pixelated;
  overflow:hidden;
}

.bushSprite{
  width:64px; /* 4 frames */
  height:16px;
  background:url("Img/Arbusto.png") no-repeat;
}

/* OBJETOS ANIMADOS */
.spriteObject{
  overflow:hidden;
}

.spriteObjectSprite{
  image-rendering:pixelated;
  background-repeat:no-repeat;
}

/* NPC */
.npc{
  width:32px;
  height:32px;
  overflow:hidden;
}

.npcSprite{
  width:128px;
  height:128px;
  image-rendering: pixelated;
}

/* ENEMIGO */
.enemy{
  width:32px;
  height:32px;
  overflow:hidden;
}

.enemySprite{
  width:128px;
  height:128px;
  image-rendering: pixelated;
}
/* DIALOGO */
#dialog{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:min(920px, 92vw);
  min-height:140px;
  padding:0;
  background:linear-gradient(180deg, rgba(255,248,230,0.98), rgba(245,228,200,0.98));
  border:4px solid #3a2b2e;
  box-shadow:0 10px 0 #1b1416, 0 24px 40px rgba(0,0,0,0.45);
  image-rendering: pixelated;
  font-family: var(--pixel-font);
  display:none;
  z-index:99999;
}

body.touch #dialog{
  bottom:26vh;
}

.dialog-inner{
  padding:18px 20px 14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

#dialogText{
  font-size:16px;
  line-height:1.6;
  margin:0;
  color:#2f2527;
  text-shadow:1px 1px 0 rgba(255,255,255,0.5);
  white-space:pre-wrap;
}

.dialog-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12px;
  color:#4a3a3d;
  opacity:0.9;
}

#dialogHint{
  padding:4px 8px;
  border:2px solid #3a2b2e;
  background:#f4dfbe;
  color:#2f2527;
}

#gameOverScreen{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0, 0, 0, 0.82);
  z-index:100000;
}

.game-over-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  padding:28px 36px;
  border:4px solid #ffffff;
  background:#1b1b1b;
  color:#ffffff;
  text-align:center;
}

.game-over-box h2{
  margin:0;
  font-size:20px;
}

#restartButton{
  font-family:var(--pixel-font);
  font-size:14px;
  border:3px solid #ffffff;
  background:#2b2b2b;
  color:#ffffff;
  padding:12px 18px;
  cursor:pointer;
}

#restartButton:hover{
  background:#3a3a3a;
}

/* CONTROLES ANDROID */
#touchControls{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:99998;
  opacity:0;
  transition:opacity 0.2s ease;
}

body.touch #touchControls{
  opacity:1;
  pointer-events:auto;
}

body:not(.touch) #touchControls{
  display:none;
}

.dpad{
  position:absolute;
  left:4vw;
  bottom:4vh;
  width:28vmin;
  height:28vmin;
  max-width:180px;
  max-height:180px;
  min-width:120px;
  min-height:120px;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  grid-template-rows:repeat(3, 1fr);
  gap:6px;
}

.dpad-btn,
.action-btn{
  background:linear-gradient(180deg, #5a5a5a, #2e2e2e);
  border:3px solid #0f0f0f;
  box-shadow:inset 0 3px 0 rgba(255,255,255,0.12), 0 4px 0 #000;
  border-radius:10px;
  image-rendering:pixelated;
  touch-action:none;
}

.dpad-btn{
  width:100%;
  height:100%;
}

.dpad-btn.up{ grid-column:2; grid-row:1; }
.dpad-btn.left{ grid-column:1; grid-row:2; }
.dpad-btn.right{ grid-column:3; grid-row:2; }
.dpad-btn.down{ grid-column:2; grid-row:3; }

.dpad-btn:active,
.action-btn:active{
  transform:translateY(2px);
  box-shadow:inset 0 2px 0 rgba(255,255,255,0.1), 0 2px 0 #000;
}

.buttons{
  position:absolute;
  right:4vw;
  bottom:6vh;
  display:flex;
  gap:16px;
  align-items:flex-end;
}

.action-btn{
  width:18vmin;
  height:18vmin;
  max-width:120px;
  max-height:120px;
  min-width:80px;
  min-height:80px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f1f1f1;
  font-size:18px;
  letter-spacing:1px;
  user-select:none;
}

.action-btn.small{
  width:14vmin;
  height:14vmin;
  max-width:90px;
  max-height:90px;
  min-width:64px;
  min-height:64px;
  font-size:14px;
}

.action-btn span{
  text-shadow:2px 2px 0 #000;
}

@media (max-width: 720px){
  #hud{
    transform:scale(0.8);
    transform-origin:top left;
  }
  #coinCount{
    font-size:16px;
  }
  .heart{
    width:44px;
    height:44px;
  }
  #dialogText{
    font-size:14px;
  }
  #dialogHint{
    font-size:10px;
  }
}

@media (max-width: 480px){
  #hud{
    transform:scale(0.72);
  }
  #dialog{
    min-height:120px;
  }
}


</style>
</head>

function distance(a, b){
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx*dx + dy*dy);
}

     key === "w" || key === "a" || key === "s" || key === "d"){
    keys[key] = true;
  }

  if(e.key === " "){
    if(e.repeat) return;
    handleJumpPress();
    return;
  }

  if(e.key === "Enter"){
    handleActionPress();
  }
});

function bindHold(button, onDown, onUp){
  let activeId = null;

  button.addEventListener("pointerdown", e=>{
    e.preventDefault();
    if(activeId !== null) return;
    activeId = e.pointerId;
    button.setPointerCapture(e.pointerId);
    onDown();
  });

  const end = (e)=>{
    if(activeId !== e.pointerId) return;
    onUp();
    activeId = null;
    button.releasePointerCapture(e.pointerId);
  };

  button.addEventListener("pointerup", end);
  button.addEventListener("pointercancel", end);
  button.addEventListener("pointerleave", end);
}

/* COLISIÓN SOLO CON LA BASE */
function collide(nx, ny, self = null){
  const pL = nx - 12;
  const pR = nx + 12;
  const pT = ny - 12;
  const pB = ny;

  // 🔹 Colisión con objetos
  for(const o of objects){
    const oL = o.x - o.hw / 2;
    const oR = o.x + o.hw / 2;
    const oT = o.y - o.hh;
    const oB = o.y;

    if(pR > oL && pL < oR && pB > oT && pT < oB){
      return true;
    }
  }

  // Colision con bloques de pago
  for(const block of payBlocksEntities){
    if(block.unlocked) continue;

    const bL = block.x - block.hw / 2;
    const bR = block.x + block.hw / 2;
    const bT = block.y - block.hh;
    const bB = block.y;

    if(pR > bL && pL < bR && pB > bT && pT < bB){
      if(self !== null){
        return true;
      }

      if(spendCoins(block.price)){
        block.unlocked = true;
        block.el.remove();
        return false;
      }

      if(block.msgCooldown === 0 && !talking){
        openDialog(`Necesitas ${block.price} monedas para pasar.`);
        block.msgCooldown = 90;
      }
      return true;
    }
  }
  // Colision con NPCs
  for(const bush of bushesEntities){
    const bL = bush.x - bush.hw / 2;
    const bR = bush.x + bush.hw / 2;
    const bT = bush.y - bush.hh;
    const bB = bush.y;

    if(pR > bL && pL < bR && pB > bT && pT < bB){
      if(self === null && jumping){
        continue;
      }
      return true;
    }
  }

  // Colision con objetos animados
  for(const obj of animatedObjectsEntities){
    const oL = obj.x - obj.hw / 2;
    const oR = obj.x + obj.hw / 2;
    const oT = obj.y - obj.hh;
    const oB = obj.y;

    if(pR > oL && pL < oR && pB > oT && pT < oB){
      return true;
    }
  }

  // Colision con NPCs
  for(const npc of npcs){
    if(npc === self) continue;

    const nL = npc.x - npc.hw / 2;
    const nR = npc.x + npc.hw / 2;
    const nT = npc.y - npc.hh;
    const nB = npc.y;

    if(pR > nL && pL < nR && pB > nT && pT < nB){
      return true;
    }
  }

  // 🔹 Colisión con enemigos
  for(const enemy of enemies){
    if(enemy === self) continue;

    const eL = enemy.x - enemy.hw / 2;
    const eR = enemy.x + enemy.hw / 2;
    const eT = enemy.y - enemy.hh;
    const eB = enemy.y;

    if(pR > eL && pL < eR && pB > eT && pT < eB){
      return true;
    }
  }

  return false;
}

function rebuildFog(){
  fogLayer.innerHTML = "";

  const fogCount = 2;
  const duration = 70;

  for(let i = 0; i < fogCount; i++){
    const fog = document.createElement("div");
    fog.className = "fog";
    fog.style.left = "100%";
    fog.style.top = "50%";

    fog.style.setProperty("--fog-scale", 1);
    fog.style.animationDuration = duration + "s";
    fog.style.animationDelay = (-i * duration /2) + "s";

    fogLayer.appendChild(fog);
  }
}

function isInsideZone(zone, point){
  const left = zone.x - zone.hw / 2;
  const right = zone.x + zone.hw / 2;
  const top = zone.y - zone.hh;
  const bottom = zone.y;
  return (
    point.x >= left && point.x <= right &&
    point.y >= top && point.y <= bottom
  );
}

function isInFogZone(){
  return fogZones.some(zone=>isInsideZone(zone, playerPos));
}

function setFogVisible(visible){
  if(visible === fogVisible) return;
  fogVisible = visible;
  fogLayer.classList.toggle("active", fogVisible);
}

function detectZone(){
  const inEnemyZone = enemies.some(enemy=>distance(playerPos, enemy) < 220);

  if(inEnemyZone) return "enemigos";

  for(const zone of musicZones){
    const left = zone.x - zone.hw / 2;
    const right = zone.x + zone.hw / 2;
    const top = zone.y - zone.hh;
    const bottom = zone.y;
    if(
      playerPos.x >= left && playerPos.x <= right &&
      playerPos.y >= top && playerPos.y <= bottom
    ){
      return zoneMusic[zone.track] ? zone.track : "ruta";
    }
  }

  return "ruta";
}

  if(zone === currentZone || !musicUnlocked) return;
  currentZone = zone;

  Object.keys(musicTargets).forEach(name=>{
    musicTargets[name] = name === zone ? MUSIC_MAX_VOLUME : 0;
  });
}

function updateMusicFade(){
  if(!musicUnlocked) return;

  Object.entries(zoneMusic).forEach(([name, track])=>{
    const target = musicTargets[name] ?? 0;
    const diff = target - track.volume;

    if(Math.abs(diff) <= MUSIC_FADE_STEP){
      track.volume = target;
    }else{
      track.volume += Math.sign(diff) * MUSIC_FADE_STEP;
    }

    if(target > 0 && track.paused){
      track.play().catch(()=>{});
    }

    if(target === 0 && track.volume <= 0.001 && !track.paused){
      track.pause();
    }
  });
}

function unlockMusic(){
  if(musicUnlocked) return;
  musicUnlocked = true;
  Object.values(zoneMusic).forEach(track=>{
    track.volume = 0;
  });
  playZoneMusic(detectZone());
}

window.addEventListener("keydown", unlockMusic, { once: true });
window.addEventListener("pointerdown", unlockMusic, { once: true });

function createNPC(data){

  npc.style.left = data.x + "px";
  npc.style.top  = data.y + "px";

  const sprite = document.createElement("div");

  if(data.single){

    const sh = data.sh ?? 32;
    const frames = data.animFrames ?? 1;
    sprite.style.width = sw + "px";
    sprite.style.height = sh + "px";

    }
    npc.style.width = sw + "px";
    npc.style.height = sh + "px";
  }

  world.appendChild(npc);

  const entityRef = { el: npc, y: data.y };
  entities.push(entityRef);


  const npcData = {
    el: npc,
    sprite,
    x: data.x,
    y: data.y,
    dir: 0,
    frame: 0,
    timer: 0,

    hh: data.hh ?? NPC_HITBOX.h,

    animFrames: data.animFrames ?? 1,
    animSpeed: data.animSpeed ?? 12,

const dialog = document.getElementById("dialog");
const dialogText = document.getElementById("dialogText");
const dialogPage = document.getElementById("dialogPage");
const dialogHint = document.getElementById("dialogHint");

  dialogHint.textContent = "B";
}
let talking = false;
let lastActionAt = 0;
const ACTION_COOLDOWN = 160;

const DIALOG_MAX_CHARS = 140;
const dialogState = {
  pages: [],
  index: 0
};

function paginateText(text, maxChars = DIALOG_MAX_CHARS){
  const clean = String(text ?? "").replace(/\s+/g, " ").trim();
  if(!clean) return [""];

  const words = clean.split(" ");
  const pages = [];
  let current = "";

  words.forEach(word=>{
    const candidate = current ? current + " " + word : word;
    if(candidate.length > maxChars && current){
      pages.push(current);
      current = word;
    }else{
      current = candidate;
    }
  });

  if(current) pages.push(current);
  return pages;
}

function updateDialogMeta(){
  if(dialogState.pages.length > 1){
    dialogPage.textContent = `${dialogState.index + 1}/${dialogState.pages.length}`;
  }else{
    dialogPage.textContent = "";
  }
}

function clearMovement(){
  Object.keys(keys).forEach(key=>{
    keys[key] = false;
  });
}

function openDialog(text){
  dialogState.pages = paginateText(text);
  dialogState.index = 0;
  dialogText.textContent = dialogState.pages[0] ?? "";
  updateDialogMeta();
  dialog.style.display = "block";
  talking = true;
  jumping = false;
  jumpTimer = 0;
  clearMovement();
}

function closeDialog(){
  dialog.style.display = "none";
  talking = false;
  dialogState.pages = [];
  dialogState.index = 0;
  dialogText.textContent = "";
  dialogPage.textContent = "";
}

function advanceDialog(){
  if(!talking) return;
  if(dialogState.index < dialogState.pages.length - 1){
    dialogState.index++;
    dialogText.textContent = dialogState.pages[dialogState.index];
    updateDialogMeta();
  }else{
    closeDialog();
  }
}
function handleJumpPress(){
  if(gameOver) return;
  if(talking) return;
  if(!jumping){
    jumping = true;
    jumpTimer = 0;
  }
}

function handleActionPress(){
  if(gameOver) return;

  if(isTouchDevice){
    const now = performance.now();
    if(now - lastActionAt < ACTION_COOLDOWN) return;
    lastActionAt = now;
  }

  if(talking){
    advanceDialog();
    return;
  }

  for(const npc of npcs){
    const dx = Math.abs(playerPos.x - npc.x);
    const dy = Math.abs(playerPos.y - npc.y);

    if(dx < 32 && dy < 32){
      lookAtPlayer(npc);
      npc.walking = false;
      if(npc.shop && npc.shop.type === "heart"){
        const price = npc.shop.price ?? 1;
        if(health >= maxHealth){
          openDialog("Pfff...Ya tienes todos los corazones. No necesitas mas, pero si los llegas a necesitar, hablame.");
        }else if(!spendCoins(price)){
          openDialog(`Suelo vender corazones a 3 monedas... pero para alguien como tú... serán ${price}. Riesgos del negocio, ya sabes.`);
        }else{
          setHealth(health + 1);
          openDialog(`Bien hecho muchacho... no doy reembolsos.`);
        }
      }else{
        openDialog(npc.text);
      }
      break;
    }
  }
}

function hurtPlayer(enemy){
  if(playerHitCooldown > 0 || health <= 0) return;

  setHealth(health - 1);
  playerHitCooldown = 28;
  hurtTimer = hurtDuration;

  const dx = playerPos.x - enemy.x;
  const dy = playerPos.y - enemy.y;
  const dist = Math.hypot(dx, dy) || 1;

  knockbackVX = (dx / dist) * knockbackStrength;
  knockbackVY = (dy / dist) * knockbackStrength;
  knockbackTimer = knockbackDuration;

  // dispara un salto corto al recibir el golpe
  jumping = true;
  jumpTimer = 0;
}



function update(){

    requestAnimationFrame(update);

  }

    if(block.msgCooldown > 0) block.msgCooldown--;
  });

  if(playerHitCooldown > 0) playerHitCooldown--;

  if(!talking){
    if(keys["ArrowUp"]||keys["w"]){
      ny -= speed;
      direction = 3;
      moving = true;
    }
    if(keys["ArrowDown"]||keys["s"]){
      ny += speed;
      direction = 0;
      moving = true;
    }
    if(keys["ArrowLeft"]||keys["a"]){
      nx -= speed;
      direction = 1;
      moving = true;
    }
    if(keys["ArrowRight"]||keys["d"]){
      nx += speed;
      direction = 2;
      moving = true;
    }
  }

  if(!collide(nx,ny)){
    playerPos.x = nx;
    playerPos.y = ny;
  }

  if(knockbackTimer > 0){
    if(!talking){
      const nextX = playerPos.x + knockbackVX;
      const nextY = playerPos.y + knockbackVY;

      if(!collide(nextX, playerPos.y)) playerPos.x = nextX;
      if(!collide(playerPos.x, nextY)) playerPos.y = nextY;
    }

  }

  if(moving){

      frame = (frame + 1) % 4;
      frameTimer = 0;
    }
  }else{
    frame = 0; // frame quieto
  }

  sprite.style.backgroundPosition =
    `-${frame * 32}px -${direction * 32}px`;

  let playerScale = 1;
  let playerLiftY = 0;

  if(jumping){
    jumpTimer++;
    const t = Math.min(1, jumpTimer / jumpDuration);
    playerScale = 1 + Math.sin(Math.PI * t) * jumpScale;
    playerLiftY -= Math.sin(Math.PI * t) * 10;
    if(t >= 1){
      jumping = false;
    }
  }

  if(hurtTimer > 0){
    const ht = 1 - (hurtTimer / hurtDuration);
    playerLiftY -= Math.sin(Math.PI * ht) * 8;
    sprite.classList.toggle("hurt", hurtTimer % 4 < 2);
    hurtTimer--;
  }else{
    sprite.classList.remove("hurt");
  }

  player.style.transform = `translate(-50%, -100%) translateY(${playerLiftY}px) scale(${playerScale})`;

enemies.forEach(enemy=>{
  enemy.walkTimer++;
  if(enemy.attackCooldown > 0) enemy.attackCooldown--;

  const distPlayer = distance(
    {x: enemy.x, y: enemy.y},
    {x: playerPos.x, y: playerPos.y}
  );

  const chaseRange = 160;
  const attackRange = 22;

  if(distPlayer <= chaseRange){
    const dx = playerPos.x - enemy.x;
    const dy = playerPos.y - enemy.y;

    if(Math.abs(dx) > Math.abs(dy)){
      enemy.dir = dx > 0 ? 2 : 1;
    }else{
      enemy.dir = dy > 0 ? 0 : 3;
    }

    let nx = enemy.x;
    let ny = enemy.y;
    const speedE = 0.7;

    if(Math.abs(dx) > 2 || Math.abs(dy) > 2){
      if(dx > 2) nx += speedE;
      if(dx < -2) nx -= speedE;
      if(dy > 2) ny += speedE;
      if(dy < -2) ny -= speedE;
    }

    if(!collide(nx, ny, enemy)){
      enemy.x = nx;
      enemy.y = ny;
    }

    if(distPlayer <= attackRange && enemy.attackCooldown === 0){
      hurtPlayer(enemy);
      enemy.attackCooldown = 90;
    }
  }else{
    // paseo simple si el jugador está lejos
    if(enemy.walkTimer > 500){
      enemy.dir = Math.floor(Math.random()*4);
      enemy.walkTimer = 0;
      enemy.wait = 20 + Math.random()*20;
    }

    if(enemy.wait > 0){
      enemy.wait--;
    }else{
      let nx = enemy.x;
      let ny = enemy.y;
      const speedE = 0.4;
      if(enemy.dir === 0) ny += speedE;
      if(enemy.dir === 1) nx -= speedE;
      if(enemy.dir === 2) nx += speedE;
      if(enemy.dir === 3) ny -= speedE;
      if(!collide(nx, ny, enemy)){
        enemy.x = nx;
        enemy.y = ny;
      }else{
        enemy.wait = 20;
        enemy.dir = Math.floor(Math.random()*4);
      }
    }
  }

  enemy.el.style.left = enemy.x+"px";
  enemy.el.style.top  = enemy.y+"px";
  enemy.entityRef.y = enemy.y;

  enemy.timer++;
  if(enemy.timer > 12){
    enemy.frame = (enemy.frame + 1) % 4;
    enemy.timer = 0;
  }

  enemy.sprite.style.backgroundPosition =
    `-${enemy.frame * 32}px -${enemy.dir * 32}px`;

  // salto ocasional del enemigo (efecto visual)
  enemy.jumpWait--;
  if(enemy.jumpWait <= 0 && !enemy.jumping){
    enemy.jumping = true;
    enemy.jumpTimer = 0;
  }

  if(enemy.jumping){
    enemy.jumpTimer++;
    const t = Math.min(1, enemy.jumpTimer / 16);
    const scale = 1 + Math.sin(Math.PI * t) * 0.15;
    enemy.el.style.transform = `translate(-50%, -105%) scale(${scale})`;
    if(t >= 1){
      enemy.jumping = false;
      enemy.el.style.transform = "translate(-50%, -100%)";
      enemy.jumpWait = 90 + Math.random()*150;
    }
  }
});

function getDepthY(e){
  if(e.isPlayer){
    return playerPos.y;
  }
  return e.y;
}

function sortDepth(){
  entities.forEach(e=>{
    e.el.style.zIndex = Math.floor(getDepthY(e));
  });
}


player.style.left = playerPos.x+"px";
player.style.top  = playerPos.y+"px";

sortDepth();





  // CENTRAR CAMARA EN EL JUGADOR
camera.x = playerPos.x - (screen.w / 2) / zoom;
camera.y = playerPos.y - (screen.h / 2) / zoom;


// LIMITES DEL MAPA
camera.x = Math.max(0, Math.min(camera.x, 2880- screen.w / zoom));
camera.y = Math.max(0, Math.min(camera.y, 2880 - screen.h / zoom));


world.style.left = -camera.x * zoom + "px";

  coins -= amount;
  updateHUD();
  return true;
}

checkCoinPickup();
  const zone = detectZone();

const camera = {
  x: 0,
  y: 0
};

let screen = {
  w: game.clientWidth,
  h: game.clientHeight
};

function computeZoom(){
  if(!isTouchDevice) return baseZoom;
  const minSide = Math.min(window.innerWidth, window.innerHeight);
  if(minSide <= 420) return 2.1;
  if(minSide <= 560) return 2.4;
  if(minSide <= 720) return 2.8;
  return baseZoom;
}

function updateScreenSize(){
  screen.w = game.clientWidth || window.innerWidth;
  screen.h = game.clientHeight || window.innerHeight;
  zoom = computeZoom();
}

window.addEventListener("resize", updateScreenSize);
window.addEventListener("orientationchange", updateScreenSize);
updateScreenSize();

function addCoins(amount){
  coins += amount;
  updateHUD();
}

function setHealth(value){
  health = Math.max(0, Math.min(maxHealth, value));
  updateHUD();
  if(health === 0){
    showGameOver();
  }
}

restartButton.addEventListener("click", ()=>{
  window.location.reload();
});


update();
updateHUD();
